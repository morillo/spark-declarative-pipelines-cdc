# Lint the pipeline code. The pipeline itself needs a local Spark
# runtime (see README), so CI validates code quality only.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: pipx run ruff check --line-length 79 pipeline/transformations inspect_tables.py
      - name: Shell script check
        run: bash -n setup.sh run.sh inspect.sh shell.sh env.sh clean.sh
