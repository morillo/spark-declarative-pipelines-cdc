# Lint the pipeline code. The pipeline itself needs a local Spark
# runtime (see README), so CI validates code quality only.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dev group (pyright + pyspark, for type checking only)
        run: uv sync --locked --group dev
      - name: Type check (Pyright, same checks as VS Code Pylance)
        run: uv run --group dev pyright
      - name: Lint
        run: uvx ruff check --line-length 79 pipeline/transformations inspect_tables.py
      - name: Shell script check
        run: bash -n setup.sh run.sh inspect.sh shell.sh env.sh clean.sh
