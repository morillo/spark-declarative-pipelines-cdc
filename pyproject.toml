[project]
name = "spark-declarative-pipelines-cdc"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "googleapis-common-protos>=1.75.5",
    "grpcio>=1.84.0",
    "grpcio-status>=1.84.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "zstandard>=0.25",
]

[tool.uv]
# Not a package: `uv sync` only installs the Spark Connect client dependencies.
# pyspark itself comes from the shared Spark install (see README).
package = false
# The dev group (pyright + pyspark for type checking only) is NOT installed by plain
# `uv sync`: the runtime .venv must not contain pip's pyspark (see README). Use
# `uv sync --group dev` / `uv run --group dev pyright`.
default-groups = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pyspark==4.2.0",
]
